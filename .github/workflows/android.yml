name: Build Arrow Rush Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify 3,000 generated puzzles in pure Java
        run: |
          mkdir -p engine-output
          javac -d engine-output app/src/main/java/com/revolution/arrowrush/PuzzleEngine.java tests/EngineCheck.java
          java -cp engine-output EngineCheck
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowRush-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
